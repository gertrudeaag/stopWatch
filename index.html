<html>

<head>

</head>

<body>
    <div class="container">
        <div class="top-bar">

                </svg>settings</button>
            <dialog id="settingsModal">
                <div class="modal">
                    <div class="modal-box">
                        <button class="close" id="closeModal">&times;</button>

                        <h2>Stopwatch Settings</h2>

                        <label for="timeFormat">Time Format</label>
                        <input type="text" id="timeFormat" placeholder="hh:min:sec">

                        <label>
                            Sound
                            <input type="checkbox" id="sound">
                            </label>
                      <label for="shortBreak">
                        Short Break  
                        <input type="text" id="shortTime" placeholder="min:sec">
                            </label>
                      <label for="longBreak">
                        Long Break  
                        <input type="text" id="longTime" placeholder="min:sec">
                           </label>
                        <div class="modal-buttons">
                            <button class="btnn" id="cancelBtn">Cancel</button>
                            <button class="btnn" id="saveBtn">Save</button>
                        </div>
                    </div>
                </div>
            </dialog>
            <button class="btnn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                    width="24px" fill="#1f1f1f">
                    <path
                        d="M234-276q51-39 114-61.5T480-360q69 0 132 22.5T726-276q35-41 54.5-93T800-480q0-133-93.5-226.5T480-800q-133 0-226.5 93.5T160-480q0 59 19.5 111t54.5 93Zm146.5-204.5Q340-521 340-580t40.5-99.5Q421-720 480-720t99.5 40.5Q620-639 620-580t-40.5 99.5Q539-440 480-440t-99.5-40.5ZM480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm100-95.5q47-15.5 86-44.5-39-29-86-44.5T480-280q-53 0-100 15.5T294-220q39 29 86 44.5T480-160q53 0 100-15.5ZM523-537q17-17 17-43t-17-43q-17-17-43-17t-43 17q-17 17-17 43t17 43q17 17 43 17t43-17Zm-43-43Zm0 360Z" />
                </svg>sign in</button>
            <button class="btnn"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                    width="24px" fill="#1f1f1f">
                    <path
                        d="M480-160q-33 0-56.5-23.5T400-240q0-33 23.5-56.5T480-320q33 0 56.5 23.5T560-240q0 33-23.5 56.5T480-160Zm0-240q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Zm0-240q-33 0-56.5-23.5T400-720q0-33 23.5-56.5T480-800q33 0 56.5 23.5T560-720q0 33-23.5 56.5T480-640Z" />
                </svg></button>
        </div>
        <div class="square">
            <button id="short" class="bt">Short break </button>
            <button id="long" class="bt">Long break</button>
        </div>
        <div class="circle">
            <h1 class="timer" id="timer">01 : 00</h1>
            <button class="btn" id="button"><strong>START</strong></button>
        </div>
        <p>Time to focus</p>
        <button class="btn1" id="btn1">Reset</button>
    </div>
        <script src="./script.js"></script>
</body>

</html>
